<title>Audio UI redesign — sounds on the timeline</title>

<script>
/* Tailwind = PAGE CHROME vocabulary (see styling rule). Colors are verbatim
   cells of src/gui/theme/TailwindPalette.h — never stock Tailwind colors. */
tailwind.config = { theme: { extend: { colors: {
  base:'#262626', recessed:'#171717', raised:'#404040', raisedhover:'#525252',
  active:'#525252', hairline:'#404040', hairlinehover:'#525252', outline:'#525252',
  txt:'#f5f5f5', muted:'#a3a3a3', dim:'#737373', iconc:'#e5e5e5',
  floater:'#171717', floateredge:'#262626',
  wband:'#737373', wedge:'#a3a3a3', wtext:'#171717',
  ok:'#22c55e', warn:'#f59e0b', bad:'#ef4444',
}, fontFamily:{ geist:['Geist','-apple-system','"Segoe UI"','sans-serif'] } } } }
</script>
<style>
/* ==========================================================================
   STYLING RULE (this mockup is the implementation template):
   PRODUCT components — .tl/.ruler/.track/.lane/.clip/.menu/.inspector/.strip/
   .export-panel/.led/.over-mark and their parts — are styled ONLY by these
   custom classes, and their colors come ONLY from the token vars below
   (src/gui/theme/TailwindPalette.h verbatim via src/gui/theme/Colors.h, dark).
   PAGE CHROME — page head, section headings, captions, capture frames — is
   styled ONLY with Tailwind utilities. NEVER mix the two vocabularies on one
   element, and never pick ad hoc between them.
   SPACING SCALE: one rhythm — 4 / 6 / 8 / 12 px (rows pad 6px vertical,
   8px horizontal; gaps 4 or 8). No magic pixel numbers outside this scale,
   the theme tokens, and the app-measured metrics (menu 24px rows / 9px
   separators, from standard.ssa + AppStyle.cpp).
   LAYOUT: flow first (flex rows/columns). Absolute positioning only where
   inherently positional: lane placement, the gain line, trim handles.
   ========================================================================== */
:root {
  --base:#262626;        /* neutral-800  kBase            (dark col 8) */
  --recessed:#171717;    /* neutral-900  kRecessed        (dark col 9) */
  --raised:#404040;      /* neutral-700  kRaised          (dark col 7) */
  --hairline:#404040;    /* neutral-700  kHairline        (dark col 7) */
  --hairlinehover:#525252;/* neutral-600 kHairlineHover   (dark col 6) */
  --outline:#525252;     /* neutral-600  kOutline         (dark col 6) */
  --text:#f5f5f5;        /* neutral-50   kText            (dark col 1) */
  --text-muted:#a3a3a3;  /* neutral-400  kTextMuted       (dark col 4) */
  --text-dim:#737373;    /* neutral-500  kTextMutedDim    (dark col 5) */
  --icon:#e5e5e5;        /* neutral-200  kIcon            (dark col 2) */
  --active:#525252;      /* neutral-600  kActive          (dark col 6) */
  --floater-body:#171717;/* neutral-900  kFloaterBody     (dark col 9) */
  --floater-edge:#262626;/* neutral-800  kFloaterEdge     (dark col 8) */
  --recessed-guide:#404040;/* neutral-700 kRecessedGuideLine (dark col 7) */
  --window-band:#737373; /* neutral-500  kWindowBand @30% — playback-window
                            band ONLY; audio chrome never uses it */
  --window-edge:#a3a3a3; /* neutral-400  kWindowEdge      (dark col 4) */
  --accent-bright-text:#171717;/* neutral-900 kAccentBrightText (dark col 9) */
}
/* accent = accent row at dark col 7 (kAccent) / col 4 (kAccentBright) /
   col 6 (kAccentHover). RESERVED for playhead/selection/marquee — audio
   chrome stays neutral. */
body[data-accent="red"]     { --accent:#b91c1c; --accent-bright:#f87171; --accent-hover:#dc2626; }
body[data-accent="orange"]  { --accent:#c2410c; --accent-bright:#fb923c; --accent-hover:#ea580c; }
body[data-accent="yellow"]  { --accent:#a16207; --accent-bright:#facc15; --accent-hover:#ca8a04; }
body[data-accent="green"]   { --accent:#15803d; --accent-bright:#4ade80; --accent-hover:#16a34a; }
body[data-accent="teal"]    { --accent:#0f766e; --accent-bright:#2dd4bf; --accent-hover:#0d9488; }
body[data-accent="cyan"]    { --accent:#0e7490; --accent-bright:#22d3ee; --accent-hover:#0891b2; }
body[data-accent="violet"]  { --accent:#6d28d9; --accent-bright:#a78bfa; --accent-hover:#7c3aed; }
body[data-accent="fuchsia"] { --accent:#a21caf; --accent-bright:#e879f9; --accent-hover:#c026d3; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--recessed); color:var(--text);
  font:400 13px/1.45 "Geist",-apple-system,"Segoe UI",sans-serif; padding:28px; }
/* CLEAN MODE (#clean / #only=<surface>): only product surfaces render */
body.clean .doc { display:none !important; }
body.clean { padding:12px; }
/* annotation callout badges: page chrome, hidden by default */
.el { position:relative; }
.el::after { content:attr(data-el); position:absolute; top:-7px; right:-7px;
  width:15px; height:15px; border-radius:50%; background:#7c2d12;
  color:#ffedd5; font-size:9px; font-weight:600; display:none; place-items:center; }
body.show-el .el::after { display:grid; }
/* ROW METRICS: one variable per row type drives BOTH the header column and
   the content column (identical border-box heights -> shared row boundaries) */
:root {
  --row-ruler:28px;
  --row-track:48px;
  --row-lane:84px;
  --row-lane-compact:76px;
}
/* ---- Animation panel chrome — matches the real app (reference:
     .scratch-orch/capture-home/timeline_detail.png): titled 'Animation' panel
     with the dock-float mark, narrow '>' track heads, sparse ruler (1/48/96
     style) with fine ticks below the numbers, light-violet frame pill, thin
     violet playhead fading at the bottom, vertical transport strip on the
     panel's right edge. ---- */
.tl { width:100%; max-width:1560px; background:var(--base);
  border:1px solid var(--recessed); border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; }
/* header bar: [panel name] [transport, horizontal] [MIX meter + OVER]
   [SPARE SPACE] [float mark] — the planned timeline header (the vertical
   transport column is gone). 26px buttons = AeIconButton metric. */
.tl-bar { display:flex; align-items:center; gap:8px; height:34px;
  padding:0 8px; border-bottom:1px solid var(--hairline); }
.tl-name { font-size:12px; font-weight:600; margin-right:4px; }
.tbtn { width:26px; height:26px; display:grid; place-items:center;
  border-radius:4px; color:var(--icon); cursor:pointer; }
.tbtn.loop { border:1px solid var(--outline); background:var(--active);
  color:var(--text); }
.tsep { width:1px; height:18px; background:var(--hairline); margin:0 4px; }
.spare { flex:1 1 auto; }
.dock-float { width:16px; height:16px; display:grid; place-items:center;
  color:var(--text-muted); }
/* MIX meter: a proper small meter — segmented LED cells in a well */
.meter { display:flex; gap:1px; }
.meter span { width:3px; height:9px; background:var(--hairline); }
.meter .g { background:#22c55e; }
.meter .a { background:#f59e0b; }
.meter .r { background:#ef4444; }
.tl-main { display:flex; flex:1; min-height:0; }
.tl-heads { width:110px; flex:0 0 110px; border-right:1px solid var(--hairline); }
.thead { display:flex; align-items:flex-start; gap:6px; padding:6px 8px;
  font-size:11px; color:var(--text); border-bottom:1px solid var(--hairline); }
.thead .tname { flex:1 1 auto; min-width:0; overflow:hidden;
  white-space:nowrap; text-overflow:ellipsis; }
.thead .exp { flex:0 0 12px; height:12px; color:var(--text-muted); margin-top:1px; }
.thead.sample { height:calc(var(--row-ruler) + var(--row-track)); }
.thead.lane-h { height:var(--row-lane); }
.tl-body { flex:1; position:relative; min-width:0; }
.ruler { height:var(--row-ruler); position:relative; }
.rulenum { position:absolute; top:4px; font-size:11px; color:var(--text-muted);
  transform:translateX(-50%); }
.tick { position:absolute; top:18px; height:6px; width:1px;
  background:var(--text-dim); }
.pill { position:absolute; top:2px; transform:translateX(-50%);
  background:var(--accent-bright); color:var(--accent-bright-text);
  font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; }
.track { height:var(--row-track); border-bottom:1px solid var(--hairline);
  position:relative; background:var(--recessed); }
.lane { height:var(--row-lane); border-bottom:1px solid var(--hairline);
  position:relative; background:var(--recessed); }
.lane.compact { height:var(--row-lane-compact); border-bottom:none; }
.playhead { position:absolute; top:0; bottom:0; width:2px; z-index:6;
  pointer-events:none;
  background:linear-gradient(to bottom, var(--accent-bright) 72%, transparent); }
/* MUTE = the app's layer-visibility language, exact values:
   ObjectTreeWidget.cpp baseOpacity 0.66 (hidden scope), AppStyle.cpp
   kBranchCaretOpacity / kBranchLineOpacity 0.4. A muted scope draws at
   reduced opacity — no washes, no grays. The crossed-speaker UNMUTE control
   (top-right, only in the muted state) fades with its clip. */
.clip.muted { opacity:.66; }
.thead.muted .tname, .thead.muted .lmute { opacity:.66; }
.thead.muted .exp { opacity:.4; }
.unmute { width:24px; height:24px; display:grid; place-items:center;
  border-radius:4px; color:var(--text-muted); cursor:pointer; }
.unmute:hover { background:var(--active); color:var(--text); }
/* lane hearing control (lane header) + lane-muted band wash: the wash covers
   the WHOLE band (empty space included) so lane-mute never reads as clip-mute */
.lmute { margin-left:auto; margin-top:-1px; width:22px; height:22px;
  display:grid; place-items:center; border-radius:4px; cursor:pointer;
  color:var(--icon); }
.lane.muted > * { opacity:.66; }
.thead-add { display:flex; align-items:center; padding:2px 8px; }
.thead-add .plus { width:20px; height:20px; display:grid; place-items:center;
  border-radius:4px; color:var(--icon); cursor:pointer; }
.thead-add .plus:hover { background:var(--active); }
.drop-hint { position:absolute; inset:8px; border:1px dashed var(--recessed-guide);
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  gap:8px; color:var(--text-dim); font-size:13px; }
/* ---- clip (FLOW: head row + wave body column; absolute only for lane
   placement on .clip, the gain line and the trim handles) ---- */
.clip { position:absolute; top:6px; bottom:6px; border-radius:6px;
  background:var(--raised); border:1px solid var(--outline);
  display:flex; flex-direction:column; }
.clip.hovering { border-color:var(--hairlinehover); }
.clip.selected { border-color:var(--accent-bright); }
.clip.err { border-color:#ef4444; }
.clip.parked { opacity:.55; }
.clip.ghost { opacity:.35; border-style:dashed; }
.clip-head { display:flex; align-items:center; gap:8px; padding:6px 8px; }
.clip-name { flex:1 1 auto; min-width:0; font-size:13px; line-height:18px;
  font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.face { display:flex; align-items:center; gap:4px; flex:0 0 auto; }
/* control scale from src/gui/qml: AeIconButton (26px target / 15px glyph),
   AeCheckBox (24px row / 16px box) — the clip face uses the 24px standard
   with an 18px glyph for presence at clip scale */
.ft { width:24px; height:24px; border-radius:4px; display:grid;
  place-items:center; cursor:pointer; }
.ft i { color:inherit; }
.ft.on { background:var(--active); color:var(--text); }
.ft.off { color:var(--text-dim); }
.fx { width:24px; height:24px; display:grid; place-items:center;
  color:var(--text-dim); cursor:pointer; }
.clip-body { position:relative; flex:1 1 auto; min-height:0; }
.wavewrap { height:100%; }
.wave { display:block; width:100%; height:100%;
  transform:scaleY(1.15); opacity:.5; fill:var(--text-muted); }
.vline { position:absolute; left:0; right:0; top:38%; height:1.5px;
  background:var(--text-muted); cursor:ns-resize; }
.gain { position:absolute; top:calc(38% + 5px); left:8px; font-size:10px;
  padding:2px 6px; border-radius:4px; background:var(--base); color:var(--text); }
.edge { position:absolute; top:8px; bottom:8px; width:10px;
  background:transparent; cursor:ew-resize; }
.edge::before { content:""; position:absolute; top:0; bottom:0; width:4px;
  border-radius:2px; background:var(--window-edge); }
.edge.l { left:-5px; }
.edge.l::before { left:3px; }
.edge.r { right:-5px; }
.edge.r::before { right:3px; }
.err-banner { padding:3px 8px; background:#7f1d1d; color:#fef2f2; font-size:11px;
  border-radius:0 0 5px 5px; }
/* ---- context menu (app QMenu conventions: recessed panel + 1px base edge,
   24px rows inset 4px, accentHover selection, 9px separators) ---- */
.menu { width:214px; background:var(--floater-body); border:1px solid var(--base);
  border-radius:8px; padding:4px; box-shadow:0 10px 24px #09090b; }
.mi { height:24px; display:flex; align-items:center; gap:8px;
  padding:0 12px 0 6px; border-radius:3px; font-size:12px; color:var(--text);
  cursor:pointer; white-space:nowrap; }
.mi:hover { background:var(--accent-hover); color:#f5f5f5; }
.mi.danger { color:#ef4444; }
.mi i { color:inherit; }
.mi .val { margin-left:auto; color:var(--text-dim); font-size:11px; }
.msep { height:9px; position:relative; }
.msep::after { content:""; position:absolute; left:8px; right:8px; top:4px;
  height:1px; background:var(--hairline); }
.mchk { position:relative; width:11px; height:11px; flex:0 0 11px;
  border-radius:2px; border:1px solid var(--outline); background:var(--raised); }
.mchk.on { background:var(--accent); border-color:var(--accent); }
.mchk.on::after { content:""; position:absolute; left:1.5px; top:2px;
  width:5px; height:2.5px; border-left:1.5px solid #f5f5f5;
  border-bottom:1.5px solid #f5f5f5; transform:rotate(-45deg); }
/* ---- frame editor popover (AeNumberField / AeFrameRangeRow language;
   opened on demand, never by selection) ---- */
.inspector { position:absolute; z-index:30; width:250px;
  background:var(--floater-body); border:1px solid var(--floater-edge);
  border-radius:8px; padding:8px; box-shadow:0 8px 20px #09090b; }
.ititle { font-size:12px; font-weight:600; line-height:18px; }
.irow { display:flex; gap:8px; margin-top:6px; }
.ifield { display:flex; flex-direction:column; gap:4px; flex:1 1 0; }
.ilabel { font-size:12px; color:var(--text-muted); }
.numfield { display:flex; align-items:center; gap:6px; height:26px; width:100%;
  padding:0 8px; border-radius:4px; background:var(--raised);
  border:1px solid var(--outline); font-size:12px; }
.numfield .unit { margin-left:auto; color:var(--text-dim); font-size:11px; }
.ipath { font-size:12px; color:var(--text-dim); margin-top:6px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* ---- transport readout strip ---- */
.readout { display:flex; align-items:center; gap:8px; }
.sicon { font-size:18px; color:var(--icon); }
.sval { font-size:12px; color:var(--text-muted); }
.slabel { font-size:12px; font-weight:600; }
.led { display:flex; gap:2px; }
.led span { width:5px; height:10px; border-radius:1px; background:var(--recessed); }
.led .l1,.led .l2 { background:#22c55e; }
.led .l3 { background:#f59e0b; }
.led .l4,.led .l5 { background:#ef4444; }
/* compact-height proposals (gate choice): the app's row rhythm (28px, 12px
   text) vs 44px for waveform legibility */
.lane.h-a, .thead.h-a { height:28px; }
.lane.h-b, .thead.h-b { height:44px; }
.miniclip { position:absolute; top:2px; bottom:2px; border-radius:4px;
  background:var(--raised); border:1px solid var(--outline);
  display:flex; align-items:center; gap:8px; padding:0 8px; }
.mc-name { font-size:12px; font-weight:600; color:var(--text); }
.mc-wave { height:60%; flex:1; opacity:.5; fill:var(--text-muted); }
/* OVER: terse latched metering mark — unlit = clear, lit = over (click clears) */
.over-mark { font-size:10px; font-weight:600; letter-spacing:.08em;
  padding:2px 8px; border-radius:4px; cursor:pointer; user-select:none;
  border:1px solid var(--outline); background:transparent; color:var(--text-dim); }
.over-mark.lit { background:#ef4444; border-color:#ef4444; color:#fef2f2; }
/* ---- export surfaces (unchanged app QML) ---- */
.export-panel { width:460px; padding:8px 12px; border-radius:8px;
  background:var(--floater-body); border:1px solid var(--floater-edge); }
.ep-row { display:flex; align-items:center; gap:8px; }
.ep-check { width:16px; height:16px; border-radius:3px;
  background:var(--accent); border:1px solid var(--accent);
  display:grid; place-items:center; color:#f5f5f5; font-size:11px; }
.ep-facts { display:flex; gap:12px; font-size:12px; margin-top:8px; }
.ep-key { flex:0 0 104px; color:var(--text-muted); }
.ep-dim { color:var(--text-dim); }
</style>
</head>

// QML port: AudioLane (TimeLineWidget lane) — a sound lane under the animation tracks.
function Lane({ children, empty, compact, muted }) {
  return <div className={"lane" + (compact ? " compact" : "") + (muted ? " muted" : "")}>
    {empty
      ? <div className="drop-hint"><Ico n="file-audio" />Drop a sound file here</div>
      : children}
  </div>;
}

// QML port: Clip.qml (AeClip) — one sound clip: name strip + wave body.
// Props: file, peaks (decoded file peaks id) | missing, inExport, muted,
// hover, selected, ghost, gain, x, handles, style.
// FACE IS CLEAN AT REST: filename + waveform ONLY — no buttons, no marks.
// A MUTED clip shows a grayed body and the crossed-speaker UNMUTE control
// top-right (it appears ONLY when muted; click unmutes). MUTE = OUT OF THE
// MIX ENTIRELY (not heard AND not exported — one audio truth). selected =
// accent outline ONLY. DATA TRUTH: peaks render only from a readable file.
function Clip({ file, peaks, missing, muted,
                hover, selected, ghost, gain, x, handles, style }) {
  const hasPeaks = peaks && !missing;
  const cls = ["clip",
    hover && "hovering", selected && "selected", missing && "err",
    muted && "muted", ghost && "ghost"].filter(Boolean).join(" ");
  return (
    <div className={cls} style={style}>
      {!ghost && <div className="clip-head">
        <div className="clip-name" title={file}>{file}</div>
        <div className="face">
          {muted && <span className="unmute" title="Unmute"><Ico n="speaker-slash" s={18} /></span>}
          {x && <span className="fx" title="Remove clip"><Ico n="x" s={18} /></span>}
        </div>
      </div>}
      <div className="clip-body">
        {hasPeaks && <React.Fragment>
          <div className="wavewrap">
            <svg className="wave" viewBox="0 0 240 24" preserveAspectRatio="none">
              <use href={"#" + peaks} />
            </svg>
          </div>
          <div className="vline"></div>
          {gain && <div className="gain">{gain}</div>}
        </React.Fragment>}
      </div>
      {handles && <React.Fragment>
        <div className="edge l"></div><div className="edge r"></div>
      </React.Fragment>}
      {missing && <div className="err-banner">Sound file missing</div>}
    </div>
  );
}

// QML port: ClipContextMenu.qml — clip right-click menu (app QMenu conventions).
// First/Last frame rows are the always-available DISPLAY of the numbers;
// "Edit frames…" opens the frame editor on demand (double-click does too).
// "Mute" is the clip-level hearing control (the lane owns "Hear while
// working"); heard = lane heard AND clip not muted.
// ONE control: Mute (lane header owns lane-level Mute). Mute = out of the mix
// entirely — not heard AND not exported.
function ClipContextMenu({ muted, first, last }) {
  return (
    <div className="menu surface" id="surface-contextmenu">
      <div className="mi"><span className={"mchk " + (muted ? "on" : "")}></span>Mute</div>
      <div className="msep"></div>
      <div className="mi">First frame<span className="val">{first} fr</span></div>
      <div className="mi">Last frame<span className="val">{last} fr</span></div>
      <div className="mi"><Ico n="pencil-simple" />Edit frames…</div>
      <div className="msep"></div>
      <div className="mi"><Ico n="folder-open" />Reveal file</div>
      <div className="msep"></div>
      <div className="mi danger"><Ico n="trash" />Remove clip</div>
    </div>
  );
}

// QML port: LaneContextMenu.qml — lane (sound track) context menu: lane
// hearing, list lifecycle ("Add sound lane" / "Rename lane…" / "Delete lane";
// Rename included as the standard list action in the app's ellipsis-action
// convention). Delete lane removes the lane's clips behind the app's
// overwrite-confirm modal convention.
function LaneContextMenu({ muted }) {
  return (
    <div className="menu surface" id="surface-lanemenu">
      <div className="mi"><span className={"mchk " + (muted ? "on" : "")}></span>Mute</div>
      <div className="msep"></div>
      <div className="mi"><Ico n="plus" s={16} />Add sound lane</div>
      <div className="mi"><Ico n="pencil-simple" s={16} />Rename lane…</div>
      <div className="msep"></div>
      <div className="mi danger"><Ico n="trash" s={16} />Delete lane</div>
    </div>
  );
}

// QML port: Inspector.qml — the frame editor popover (AeNumberField/
// AeFrameRangeRow language). ON-DEMAND only: opened by "Edit frames…" or

      <div className="irow">

function Page() {

    document.querySelectorAll(".swatch").forEach(s => s.addEventListener("click", () => {
      document.body.dataset.accent = s.dataset.a;
      document.querySelectorAll(".swatch").forEach(x => x.style.outline = "");
      s.style.outline = "2px solid #a3a3a3"; s.style.outlineOffset = "2px";
    }));
    /* CLEAN MODE: #clean = product surfaces only; #only=<surface-id> isolates
       one surface for tight captures (ancestors + descendants stay visible). */
    const h = location.hash || "";
    const only = (h.match(/^#only=([\w-]+)/) || [])[1];
    if (h.includes("clean") || only) {
      document.body.classList.add("clean");
      if (only) {
        const target = document.getElementById(only);
        document.querySelectorAll(".surface").forEach(s => {
          if (s === target) s.style.display = "";
          else if (!s.contains(target) && !target.contains(s)) s.style.display = "none";
        });
        let n = target;
        while (n && n !== document.body) {
          Array.from(n.parentElement.children).forEach(c => {
            if (c !== n && !c.contains(target) && !c.classList.contains("keep"))
              c.style.display = "none";
          });
          n.style.margin = "0";
          n = n.parentElement;
        }
        /* the frame editor lives only inside the states band; the walk above
           already excludes it from unrelated captures */
        document.body.style.padding = "0";
      }
    }

  const hex = { red: "#b91c1c", orange: "#c2410c", yellow: "#a16207", green: "#15803d",

      <ClipFaceOptions />

      <div className="section-h doc">The mix that ships — passive transport readout</div>
      <div className="case-cap doc">Master meter — one smart slot<small>A master meter (NLE convention — never on clips). Normal playback: the meter cells only. When the sum would clip: the slot REPLACES the cells with the terse red OVER mark, latched until click-to-clear — then the meter returns. Chrome appears only when it has something to say. One audio truth: the readout measures the real export sum.</small></div>
      <div className="surface flex gap-8 flex-wrap items-start mt-2" id="surface-readouts">
        <div className="flex flex-col gap-2">
          <div className="case-cap doc">Resting</div>
          <ReadoutStrip level={2} />
          <div className="text-xs text-muted doc">At rest the slot shows the meter only — no OVER chrome when there is nothing to say.</div>
        </div>
        <div className="flex flex-col gap-2">
          <div className="case-cap doc">Latched</div>
          <ReadoutStrip latched level={5} />
          <div className="text-xs text-muted doc">OVER replaces the meter cells and latches; click clears it and the meter returns.</div>
        </div>
      </div>

      <div className="section-h doc">Export dialog surfaces (unchanged)</div>
      <div className="case-cap doc">What ships is still confirmed at export<small>The existing “Export with audio” checkbox and the “Audio:” facts row stay exactly as they are — the clip toggles and context menu decide per sound, this dialog decides the whole file.</small></div>
      <div className="mt-2 surface" id="surface-export-wrap"><ExportSurfaces /></div>

      <HeightsOptions />
      <SpecRegion />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
