<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Geist, Inter, sans-serif">
  <!-- The four surfaces a mask appears on, in the app's dark theme tokens:
       base #262626, recessed #171717, raised #404040, hairline #404040,
       text #f5f5f5, muted #a3a3a3, dim #737373, accent #a78bfa. -->

  <!-- ============ 1. INSPECTOR: the Mask card, three states ============ -->
  <text x="16" y="26" font-size="13" fill="#a3a3a3">1 · Inspector — one card, three states</text>

  <!-- (a) no mask -->
  <g>
    <rect x="16" y="42" width="330" height="86" rx="6" fill="#262626" stroke="#404040"/>
    <text x="30" y="66" font-size="13" fill="#f5f5f5">Mask</text>
    <circle cx="316" cy="62" r="5" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="30" y="92" font-size="11" fill="#a3a3a3">none</text>
    <rect x="30" y="100" width="86" height="20" rx="4" fill="#404040" stroke="#525252"/>
    <text x="73" y="114" font-size="11" fill="#f5f5f5" text-anchor="middle">Add mask</text>
    <text x="126" y="114" font-size="11" fill="#737373">reveals all — nothing changes yet</text>
    <text x="360" y="66" font-size="11" fill="#737373">state a</text>
  </g>

  <!-- (b) static -->
  <g>
    <rect x="16" y="140" width="330" height="112" rx="6" fill="#262626" stroke="#404040"/>
    <text x="30" y="164" font-size="13" fill="#f5f5f5">Mask</text>
    <!-- thumbnail: a matte -->
    <rect x="30" y="176" width="72" height="48" rx="3" fill="#171717" stroke="#404040"/>
    <path d="M30 224 L30 176 L102 176 L102 200 Q78 214 60 206 Q40 198 30 224 Z" fill="#e5e5e5" opacity="0.85"/>
    <path d="M30 224 L30 176 L46 176 L40 224 Z" fill="#171717"/>
    <!-- eye on, hollow key dot -->
    <g transform="translate(118,182)">
      <path d="M0 8 Q8 0 16 8 Q8 16 0 8 Z" fill="none" stroke="#a3a3a3" stroke-width="1.3"/>
      <circle cx="8" cy="8" r="2.4" fill="#a3a3a3"/>
    </g>
    <circle cx="316" cy="160" r="5" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="118" y="212" font-size="11" fill="#a3a3a3">static — paints the default key</text>
    <rect x="118" y="220" width="58" height="20" rx="4" fill="#404040" stroke="#525252"/>
    <text x="147" y="234" font-size="11" fill="#f5f5f5" text-anchor="middle">Invert</text>
    <rect x="184" y="220" width="56" height="20" rx="4" fill="#171717" stroke="#404040"/>
    <text x="212" y="234" font-size="11" fill="#a3a3a3" text-anchor="middle">Clear</text>
    <text x="360" y="164" font-size="11" fill="#737373">state b</text>
  </g>

  <!-- (c) keyed, playhead between two keys -->
  <g>
    <rect x="16" y="264" width="330" height="132" rx="6" fill="#262626" stroke="#404040"/>
    <text x="30" y="288" font-size="13" fill="#f5f5f5">Mask</text>
    <rect x="286" y="278" width="26" height="18" rx="4" fill="#a78bfa"/>
    <text x="299" y="291" font-size="10" fill="#171717" text-anchor="middle">2 keys</text>
    <circle cx="316" cy="272" r="5" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="30" y="300" width="72" height="48" rx="3" fill="#171717" stroke="#404040"/>
    <path d="M30 348 L30 300 L102 300 L102 322 Q78 336 60 328 Q40 320 30 348 Z" fill="#e5e5e5" opacity="0.55"/>
    <g transform="translate(118,306)">
      <path d="M0 8 Q8 0 16 8 Q8 16 0 8 Z" fill="none" stroke="#a3a3a3" stroke-width="1.3"/>
      <circle cx="8" cy="8" r="2.4" fill="#a3a3a3"/>
    </g>
    <!-- the between-keys hint: the blend is read-only, one press keys it -->
    <text x="118" y="326" font-size="11" fill="#fbbf24">blended between keys — read only</text>
    <rect x="118" y="334" width="92" height="20" rx="4" fill="#404040" stroke="#a78bfa"/>
    <text x="164" y="348" font-size="11" fill="#f5f5f5" text-anchor="middle">Key at frame 34</text>
    <text x="118" y="374" font-size="11" fill="#737373">painting resumes on that key — no silent auto-keys</text>
    <text x="360" y="288" font-size="11" fill="#737373">state c</text>
  </g>

  <!-- ============ 2. TREE: the row chip ============ -->
  <text x="16" y="424" font-size="13" fill="#a3a3a3">2 · Object tree — a chip on the row</text>
  <g>
    <rect x="16" y="438" width="330" height="26" fill="#404040"/>
    <text x="34" y="455" font-size="11" fill="#f5f5f5">character</text>
    <rect x="298" y="445" width="14" height="14" rx="2" fill="#171717" stroke="#404040"/>
    <path d="M298 459 L298 445 L312 445 L312 452 Q304 456 300 454 Q299 455 298 459 Z" fill="#e5e5e5" opacity="0.8"/>
    <circle cx="322" cy="452" r="3.5" fill="#a78bfa"/>
  </g>
  <g>
    <rect x="16" y="464" width="330" height="26" fill="none"/>
    <text x="34" y="481" font-size="11" fill="#a3a3a3">head</text>
    <rect x="298" y="471" width="14" height="14" rx="2" fill="#171717" stroke="#404040"/>
    <path d="M298 485 L298 471 L312 471 L312 475 Q306 478 302 477 Q299 476 298 485 Z" fill="#e5e5e5" opacity="0.45"/>
  </g>
  <g>
    <rect x="16" y="490" width="330" height="26" fill="none"/>
    <text x="34" y="507" font-size="11" fill="#a3a3a3">shadow</text>
    <text x="298" y="507" font-size="11" fill="#404040">–</text>
  </g>
  <text x="360" y="452" font-size="11" fill="#737373">keyed: chip + a dot</text>
  <text x="360" y="470" font-size="11" fill="#737373">static: chip alone</text>
  <text x="360" y="488" font-size="11" fill="#737373">none: no chip</text>
  <text x="360" y="510" font-size="11" fill="#737373">pressing the chip selects</text>
  <text x="360" y="524" font-size="11" fill="#737373">the mask channel</text>

  <!-- ============ 3. TIMELINE: the lane ============ -->
  <text x="16" y="556" font-size="13" fill="#a3a3a3">3 · Timeline — a lane, like every channel</text>
  <g>
    <rect x="16" y="570" width="330" height="22" fill="#262626" stroke="#404040" stroke-width="0.5"/>
    <text x="24" y="585" font-size="10" fill="#a3a3a3">character</text>
    <circle cx="120" cy="581" r="4" fill="#a78bfa"/>
    <circle cx="228" cy="581" r="4" fill="#a78bfa"/>
    <circle cx="228" cy="581" r="6.5" fill="none" stroke="#f5f5f5" stroke-width="1"/>
  </g>
  <g>
    <rect x="16" y="592" width="330" height="22" fill="#262626" stroke="#404040" stroke-width="0.5"/>
    <text x="24" y="607" font-size="10" fill="#a3a3a3">Mask</text>
    <circle cx="120" cy="603" r="4" fill="#c084fc"/>
    <circle cx="180" cy="603" r="4" fill="#c084fc"/>
    <circle cx="228" cy="603" r="4" fill="#c084fc"/>
    <path d="M120 603 Q150 596 180 603 Q204 608 228 603" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.5"/>
  </g>
  <g>
    <rect x="16" y="614" width="330" height="22" fill="#262626" stroke="#404040" stroke-width="0.5"/>
    <text x="24" y="629" font-size="10" fill="#a3a3a3">Opacity</text>
  </g>
  <rect x="228" y="566" width="1" height="74" fill="#a78bfa"/>
  <text x="233" y="576" font-size="9" fill="#a78bfa">playhead</text>
  <text x="360" y="590" font-size="11" fill="#737373">labels use the display name</text>
  <text x="360" y="606" font-size="11" fill="#737373">keys, easing, proportionals,</text>
  <text x="360" y="622" font-size="11" fill="#737373">marquee, key menu: unchanged</text>

  <!-- ============ 4. CANVAS: the overlay ============ -->
  <text x="560" y="424" font-size="13" fill="#a3a3a3">4 · Canvas — the rubylith, only while targeting it</text>
  <g>
    <rect x="560" y="438" width="384" height="198" fill="#171717" stroke="#404040"/>
    <!-- artwork -->
    <rect x="600" y="466" width="180" height="142" fill="#3f3f46"/>
    <circle cx="668" cy="520" r="34" fill="#52525b"/>
    <rect x="706" y="546" width="60" height="34" fill="#52525b"/>
    <!-- masked-out region, rubylith -->
    <path d="M600 608 L600 466 L648 466 Q660 520 640 560 Q624 590 606 608 Z" fill="#e5484d" opacity="0.45"/>
    <rect x="600" y="466" width="180" height="142" fill="none" stroke="#525252" stroke-dasharray="3 3"/>
    <!-- brush cursor -->
    <circle cx="742" cy="560" r="18" fill="none" stroke="#f5f5f5" stroke-width="1.2"/>
    <circle cx="742" cy="560" r="9" fill="none" stroke="#f5f5f5" stroke-width="1" opacity="0.5"/>
    <text x="560" y="654" font-size="11" fill="#737373">red = hidden.  the ring is the brush: [ ] size, Alt+click samples.</text>
    <text x="560" y="670" font-size="11" fill="#737373">off the tool, the card's eye still hides the mask from the render</text>
  </g>

  <!-- ============ the tool: one selector, a new target ============ -->
  <text x="560" y="26" font-size="13" fill="#a3a3a3">5 · Toolbox — the Mask tool gains a target</text>
  <g>
    <rect x="560" y="42" width="384" height="150" rx="6" fill="#262626" stroke="#404040"/>
    <text x="576" y="64" font-size="11" fill="#a3a3a3">Target</text>
    <rect x="576" y="72" width="352" height="22" rx="4" fill="#171717" stroke="#404040"/>
    <text x="586" y="87" font-size="11" fill="#f5f5f5">head · Mask</text>
    <path d="M912 79 L918 84 L912 89" fill="none" stroke="#a3a3a3" stroke-width="1.4"/>
    <text x="576" y="112" font-size="11" fill="#a3a3a3">Value</text>
    <rect x="576" y="118" width="352" height="6" rx="3" fill="#171717"/>
    <rect x="576" y="118" width="352" height="6" rx="3" fill="#a78bfa" opacity="0.25"/>
    <circle cx="928" cy="121" r="6" fill="#f5f5f5"/>
    <text x="576" y="146" font-size="11" fill="#737373">the same list already carries each filter's amount / delay,</text>
    <text x="576" y="162" font-size="11" fill="#737373">so a layer mask is one more entry — not a second tool</text>
  </g>

  <!-- ============ decisions ============ -->
  <text x="560" y="222" font-size="13" fill="#a3a3a3">Settled by the design</text>
  <g font-size="11">
    <text x="560" y="246" fill="#f5f5f5">one mask per node</text><text x="700" y="246" fill="#737373">a stack changes the lane model</text>
    <text x="560" y="266" fill="#f5f5f5">neutral = reveal all</text><text x="700" y="266" fill="#737373">Add mask is visually a no-op</text>
    <text x="560" y="286" fill="#f5f5f5">mask × present alpha</text><text x="700" y="286" fill="#737373">after filters, so blur can't bleed out</text>
    <text x="560" y="306" fill="#f5f5f5">raster only in v1</text><text x="700" y="306" fill="#737373">no vector paths</text>
    <text x="560" y="326" fill="#f5f5f5">PSD masks import</text><text x="700" y="326" fill="#737373">as one default key, document rect</text>
    <text x="560" y="346" fill="#f5f5f5">folders too</text><text x="700" y="346" fill="#737373">shares folder opacity's composite path</text>
  </g>
  <text x="560" y="378" font-size="13" fill="#fbbf24">One open question</text>
  <text x="560" y="398" font-size="11" fill="#a3a3a3">painting between keys: refuse + “Key at frame N” (drawn), or auto-key?</text>
</svg>
